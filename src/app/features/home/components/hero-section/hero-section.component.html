<div class="relative w-full h-screen overflow-hidden">
  <div class="absolute inset-0 flex transition-transform duration-700 ease-in-out" [style.transform]="'translateX(-' + (currentSlide * 100) + '%)'">
    @for (slide of slides; track $index) {
      <div class="min-w-full h-full relative">
        <!-- Image de fond -->
        <div class="absolute inset-0">
          <img 
            [src]="slide.image" 
            [alt]="slide.title" 
            class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-br from-black/70 via-black/50 to-black/60"></div>
        </div>
        
        <!-- Contenu -->
        <div class="absolute inset-0 flex items-center justify-center z-10">
          <div class="container-custom text-center px-4 animate-fade-in">
            <h1 
              class="text-4xl md:text-6xl lg:text-7xl font-bold text-white mb-6 leading-tight drop-shadow-2xl"
              [innerHTML]="slide.title">
            </h1>
            <p class="text-lg md:text-xl lg:text-2xl text-white/90 mb-8 max-w-3xl mx-auto drop-shadow-lg">
              {{ slide.description }}
            </p>
            <button 
              class="btn-primary text-lg px-8 py-4 shadow-2xl hover:shadow-primary-500/50"
              (click)="navigateTo(slide.buttonLink)">
              {{ slide.buttonText }}
            </button>
          </div>
        </div>
      </div>
    }
  </div>

  <!-- Contrôles de navigation -->
  <button 
    class="absolute left-4 top-1/2 -translate-y-1/2 z-20 w-14 h-14 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center text-white hover:bg-white/30 transition-all duration-300 hover:scale-110 shadow-lg"
    (click)="prevSlide()"
    aria-label="Slide précédent">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
    </svg>
  </button>
  
  <button 
    class="absolute right-4 top-1/2 -translate-y-1/2 z-20 w-14 h-14 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center text-white hover:bg-white/30 transition-all duration-300 hover:scale-110 shadow-lg"
    (click)="nextSlide()"
    aria-label="Slide suivant">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
    </svg>
  </button>

  <!-- Indicateurs -->
  <div class="absolute bottom-8 left-1/2 -translate-x-1/2 z-20 flex gap-3">
    @for (slide of slides; track $index) {
      <button 
        type="button"
        class="w-3 h-3 rounded-full transition-all duration-300 bg-white"
        [class.opacity-50]="$index !== currentSlide"
        [class.scale-125]="$index === currentSlide"
        (click)="goToSlide($index)"
        [attr.aria-label]="'Aller au slide ' + ($index + 1)">
        <span class="sr-only">Slide {{ $index + 1 }}</span>
      </button>
    }
  </div>
</div>
