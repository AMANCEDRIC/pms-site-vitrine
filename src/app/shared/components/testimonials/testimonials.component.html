@if (avis.length > 0) {
  <div class="relative">
    <div class="card p-8 md:p-12">
      <div class="text-center">
        <div class="text-6xl text-primary-200 mb-6">"</div>
        <p class="text-xl md:text-2xl text-gray-700 italic leading-relaxed mb-8 max-w-3xl mx-auto">
          {{ currentAvis?.commentaire }}
        </p>
        <div class="flex flex-col items-center gap-4">
          <div class="text-center">
            <h5 class="text-xl font-semibold text-gray-900 mb-1">
              {{ currentAvis?.prenom }} {{ currentAvis?.nom }}
            </h5>
            @if (currentAvis?.entreprise) {
              <p class="text-gray-600">{{ currentAvis?.entreprise }}</p>
            }
          </div>
          <app-star-rating 
            [rating]="currentAvis?.note || 0" 
            [readonly]="true"
            size="lg">
          </app-star-rating>
        </div>
      </div>
    </div>

    @if (avis.length > 1) {
      <div class="flex justify-center items-center gap-4 mt-8">
        <button 
          class="w-12 h-12 rounded-full border-2 border-primary-600 bg-white text-primary-600 hover:bg-primary-600 hover:text-white transition-all duration-300 flex items-center justify-center shadow-md hover:shadow-lg"
          (click)="prev()"
          aria-label="Témoignage précédent">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
          </svg>
        </button>
        <div class="flex gap-2">
          @for (item of avis; track $index) {
            <button 
              class="w-3 h-3 rounded-full transition-all duration-300"
              [class.bg-primary-600]="$index === currentIndex"
              [class.bg-gray-300]="$index !== currentIndex"
              [class.scale-125]="$index === currentIndex"
              (click)="goTo($index)"
              [attr.aria-label]="'Témoignage ' + ($index + 1)">
            </button>
          }
        </div>
        <button 
          class="w-12 h-12 rounded-full border-2 border-primary-600 bg-white text-primary-600 hover:bg-primary-600 hover:text-white transition-all duration-300 flex items-center justify-center shadow-md hover:shadow-lg"
          (click)="next()"
          aria-label="Témoignage suivant">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
          </svg>
        </button>
      </div>
    }
  </div>
} @else {
  <div class="text-center py-12">
    <p class="text-gray-500">Aucun témoignage disponible pour le moment.</p>
  </div>
}
