<div class="fixed top-0 left-0 right-0 z-[60] h-10 bg-gradient-to-r from-gray-800 to-gray-900 text-white flex items-center shadow-md">
  <div class="container-custom w-full">
    <div class="flex justify-end items-center gap-6 text-sm">
      <a 
        [href]="'tel:' + telephone" 
        class="flex items-center gap-2 hover:text-primary-400 transition-all duration-300 group animate-pulse-slow hover:animate-none">
        <svg class="w-4 h-4 group-hover:scale-125 transition-transform animate-bounce" style="animation-duration: 2s;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
        </svg>
        <span class="font-medium animate-pulse-slow">{{ telephone }}</span>
      </a>
      <a 
        [href]="'mailto:' + email" 
        class="flex items-center gap-2 hover:text-primary-400 transition-all duration-300 group animate-pulse-slow hover:animate-none">
        <svg class="w-4 h-4 group-hover:scale-125 transition-transform animate-wiggle" style="animation-duration: 2s;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
        </svg>
        <span class="font-medium animate-pulse-slow">{{ email }}</span>
      </a>
    </div>
  </div>
</div>
